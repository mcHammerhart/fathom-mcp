# Smithery configuration file
# https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - fathomApiKey
    properties:
      fathomApiKey:
        type: string
        description: Your Fathom API key. Get it from https://app.fathom.video/settings/integrations
  commandFunction: |-
    config => ({
      command: 'fastmcp',
      args: ['run', 'server.py'],
      env: { FATHOM_API_KEY: config.fathomApiKey }
    })
